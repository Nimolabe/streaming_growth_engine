<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil | Streaming Growth Engine</title>
  <meta name="description" content="Streamer-Profil auf der Streaming Growth Engine.">
  <meta name="theme-color" content="#0b0a12">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/social.css">
</head>
<body class="page-social">
  <!-- ===== Navigation ===== -->
  <header class="nav">
    <a href="index.html" class="logo">SGE<span>.</span></a>
    <button class="nav-toggle" aria-label="Menü öffnen" aria-expanded="false">☰</button>
    <nav class="nav-links">
      <a href="index.html#features">Features</a>
      <a href="setups.html">Setups</a>
      <a href="index.html#start">Erste Schritte</a>
      <a href="community.html">Community</a>
      <!-- Wird von js/auth.js gesteuert -->
      <button type="button" class="btn btn-small" id="login-btn" data-open-auth="login">Anmelden</button>
      <div class="user-menu" id="user-menu" hidden>
        <a class="user-name" id="user-name" href="profil.html"></a>
        <button type="button" class="btn btn-small btn-ghost" id="logout-btn">Abmelden</button>
      </div>
    </nav>
  </header>

  <main>
    <section class="profile-page">
      <div class="profile-root" id="profile-root" aria-live="polite">
        <p class="profile-state">Profil wird geladen …</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>© <span id="year"></span> Streaming Growth Engine. Made for new streamers.</p>
  </footer>

  <!-- ===== Anmelde-Fenster ===== -->
  <div class="modal" id="auth-modal" hidden>
    <div class="modal-backdrop" data-close-auth></div>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="auth-title" data-lenis-prevent>
      <button type="button" class="modal-close" data-close-auth aria-label="Schließen">✕</button>
      <h2 id="auth-title">Anmelden</h2>

      <div class="auth-tabs">
        <button type="button" class="auth-tab active" data-tab="login">Anmelden</button>
        <button type="button" class="auth-tab" data-tab="register">Registrieren</button>
      </div>

      <p class="auth-message" id="auth-message" hidden></p>

      <form id="auth-form" novalidate>
        <label class="field" id="username-field" hidden>
          <span>Nutzername</span>
          <span class="handle-input"><span aria-hidden="true">@</span><input type="text" id="auth-username" autocomplete="username" maxlength="20" placeholder="z. B. nightowl_tv"></span>
          <small class="sge-field-hint">3–20 Zeichen: Buchstaben, Zahlen und _. Darüber finden dich andere.</small>
        </label>
        <label class="field" id="name-field" hidden>
          <span>Streamer-Name</span>
          <input type="text" id="auth-name" autocomplete="nickname" placeholder="z. B. NightOwlTV">
        </label>
        <label class="field">
          <span>E-Mail</span>
          <input type="email" id="auth-email" autocomplete="email" required placeholder="du@beispiel.de">
        </label>
        <label class="field">
          <span>Passwort</span>
          <input type="password" id="auth-password" autocomplete="current-password" required minlength="6" placeholder="Mindestens 6 Zeichen">
        </label>
        <button type="button" class="link-btn" id="forgot-btn">Passwort vergessen?</button>
        <button type="submit" class="btn btn-block" id="auth-submit">Anmelden</button>
      </form>

      <div class="divider"><span>oder</span></div>

      <button type="button" class="btn btn-ghost btn-block google-btn" id="google-btn">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Mit Google fortfahren
      </button>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/i18n.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/profil.js"></script>
</body>
</html>
