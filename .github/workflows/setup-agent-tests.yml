name: Setup-Agent Tests

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/setup-agent-tests.yml"]
  push:
    branches: [main]
    paths: ["backend/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
